<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自举案例循环图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Sarasa Gothic SC', 'Microsoft YaHei', sans-serif;
      background: #1A1A2E;
      color: #E0E0E0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 1000px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #00D4FF;
      font-size: 2.5rem;
      margin-bottom: 60px;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }
    .cycle {
      position: relative;
      width: 600px;
      height: 600px;
      margin: 0 auto;
    }
    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, #00D4FF 0%, #B388FF 100%);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 50px rgba(0, 212, 255, 0.5);
      z-index: 10;
    }
    .center-icon {
      font-size: 4rem;
      margin-bottom: 10px;
    }
    .center-text {
      font-size: 1.2rem;
      color: #1A1A2E;
      font-weight: bold;
      text-align: center;
    }
    .node {
      position: absolute;
      width: 150px;
      height: 150px;
      background: linear-gradient(135deg, #16213E 0%, #1A1A2E 100%);
      border: 3px solid #00D4FF;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .node:hover {
      border-color: #B388FF;
      box-shadow: 0 0 30px rgba(179, 136, 255, 0.5);
      transform: scale(1.1);
    }
    .node-icon {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }
    .node-text {
      font-size: 0.9rem;
      color: #E0E0E0;
      text-align: center;
      padding: 0 10px;
    }
    .node-1 { top: 0; left: 50%; transform: translateX(-50%); }
    .node-2 { top: 15%; right: 5%; }
    .node-3 { bottom: 15%; right: 5%; }
    .node-4 { bottom: 0; left: 50%; transform: translateX(-50%); }
    .node-5 { bottom: 15%; left: 5%; }
    .node-6 { top: 15%; left: 5%; }
    .arrow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 400px;
      height: 400px;
      transform: translate(-50%, -50%);
      border: 2px dashed #00D4FF;
      border-radius: 50%;
      opacity: 0.3;
      animation: rotate 20s linear infinite;
    }
    @keyframes rotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    .footer {
      text-align: center;
      margin-top: 60px;
      font-size: 1.3rem;
      color: #B388FF;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>自举案例循环图</h1>
    <div class="cycle">
      <div class="arrow"></div>
      <div class="center">
        <div class="center-icon">🎩</div>
        <div class="center-text">黑客松路演魔术师<br>用工具给自己做路演</div>
      </div>
      <div class="node node-1">
        <div class="node-icon">📥</div>
        <div class="node-text">丢入项目<br>源代码/文档</div>
      </div>
      <div class="node node-2">
        <div class="node-icon">🔍</div>
        <div class="node-text">深度分析<br>提取核心信息</div>
      </div>
      <div class="node node-3">
        <div class="node-icon">📋</div>
        <div class="node-text">构建大纲<br>匹配叙事框架</div>
      </div>
      <div class="node node-4">
        <div class="node-icon">📊</div>
        <div class="node-text">生成图表<br>可视化素材</div>
      </div>
      <div class="node node-5">
        <div class="node-icon">🎨</div>
        <div class="node-text">生成材料<br>六维版本×19种产物</div>
      </div>
      <div class="node node-6">
        <div class="node-icon">✅</div>
        <div class="node-text">交付成果<br>验证完整性</div>
      </div>
    </div>
    <div class="footer">
      同一个项目，同一套代码，不同的表达<br>
      这不是魔法，是工程化
    </div>
  </div>
</body>
</html>
