<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7步工作流流程图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Sarasa Gothic SC', 'Microsoft YaHei', sans-serif;
      background: #1A1A2E;
      color: #E0E0E0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 1200px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #00D4FF;
      font-size: 2.5rem;
      margin-bottom: 60px;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }
    .flowchart {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .step {
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, #16213E 0%, #1A1A2E 100%);
      border: 2px solid #00D4FF;
      border-radius: 12px;
      padding: 20px 30px;
      position: relative;
      transition: all 0.3s ease;
    }
    .step:hover {
      border-color: #B388FF;
      box-shadow: 0 0 30px rgba(179, 136, 255, 0.3);
      transform: translateX(10px);
    }
    .step-number {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #00D4FF 0%, #B388FF 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      color: #1A1A2E;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }
    .step-content {
      margin-left: 30px;
      flex: 1;
    }
    .step-title {
      font-size: 1.5rem;
      color: #00D4FF;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .step-desc {
      font-size: 1rem;
      color: #A0A0A0;
      line-height: 1.6;
    }
    .checkpoint {
      position: absolute;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      background: #B388FF;
      color: #1A1A2E;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(179, 136, 255, 0.5);
    }
    .arrow {
      text-align: center;
      font-size: 2rem;
      color: #00D4FF;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>7步工作流流程图</h1>
    <div class="flowchart">
      <div class="step">
        <div class="step-number">S1</div>
        <div class="step-content">
          <div class="step-title">源码深度分析</div>
          <div class="step-desc">Ask模式 · 自动扫描项目文件，提取结构化核心信息</div>
        </div>
      </div>
      <div class="arrow">↓</div>
      <div class="step">
        <div class="step-number">S2</div>
        <div class="step-content">
          <div class="step-title">信息核对</div>
          <div class="step-desc">Plan模式 · 与开发者匹配认知，确保理解无误</div>
        </div>
        <div class="checkpoint">确认点1</div>
      </div>
      <div class="arrow">↓</div>
      <div class="step">
        <div class="step-number">S3</div>
        <div class="step-content">
          <div class="step-title">路演定类</div>
          <div class="step-desc">确定路演形式，匹配叙事框架（8类路演类型）</div>
        </div>
        <div class="checkpoint">确认点2</div>
      </div>
      <div class="arrow">↓</div>
      <div class="step">
        <div class="step-number">S4</div>
        <div class="step-content">
          <div class="step-title">大纲构建</div>
          <div class="step-desc">Plan模式 · 按路演类型梳理信息，生成结构化大纲</div>
        </div>
        <div class="checkpoint">确认点3</div>
      </div>
      <div class="arrow">↓</div>
      <div class="step">
        <div class="step-number">S5</div>
        <div class="step-content">
          <div class="step-title">图表生成</div>
          <div class="step-desc">生成流程图、架构图、数据图等可视化素材</div>
        </div>
        <div class="checkpoint">确认点4</div>
      </div>
      <div class="arrow">↓</div>
      <div class="step">
        <div class="step-number">S6</div>
        <div class="step-content">
          <div class="step-title">成果生成</div>
          <div class="step-desc">按用户勾选的产物与版本，生成路演材料</div>
        </div>
        <div class="checkpoint">确认点5</div>
      </div>
      <div class="arrow">↓</div>
      <div class="step">
        <div class="step-number">S7</div>
        <div class="step-content">
          <div class="step-title">交付收尾</div>
          <div class="step-desc">验证完整性，交付最终材料</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
