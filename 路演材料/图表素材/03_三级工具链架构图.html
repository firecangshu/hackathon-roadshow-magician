<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三级工具链架构图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Sarasa Gothic SC', 'Microsoft YaHei', sans-serif;
      background: #1A1A2E;
      color: #E0E0E0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 1200px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #00D4FF;
      font-size: 2.5rem;
      margin-bottom: 60px;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }
    .toolchain {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .tool-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .tool-label {
      width: 120px;
      font-size: 1.2rem;
      color: #B388FF;
      font-weight: bold;
      text-align: right;
    }
    .tool-levels {
      display: flex;
      gap: 15px;
      flex: 1;
    }
    .tool-level {
      flex: 1;
      background: linear-gradient(135deg, #16213E 0%, #1A1A2E 100%);
      border: 2px solid #00D4FF;
      border-radius: 12px;
      padding: 20px;
      position: relative;
      transition: all 0.3s ease;
    }
    .tool-level:hover {
      border-color: #B388FF;
      box-shadow: 0 0 30px rgba(179, 136, 255, 0.3);
      transform: translateY(-3px);
    }
    .tool-level.primary {
      border-color: #00D4FF;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, #1A1A2E 100%);
    }
    .tool-level.backup {
      border-color: #B388FF;
      background: linear-gradient(135deg, rgba(179, 136, 255, 0.1) 0%, #1A1A2E 100%);
    }
    .tool-level.fallback {
      border-color: #FF6B9D;
      background: linear-gradient(135deg, rgba(255, 107, 157, 0.1) 0%, #1A1A2E 100%);
    }
    .tool-name {
      font-size: 1.1rem;
      color: #00D4FF;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .tool-desc {
      font-size: 0.9rem;
      color: #A0A0A0;
      line-height: 1.5;
    }
    .tool-stars {
      display: inline-block;
      background: rgba(0, 212, 255, 0.2);
      color: #00D4FF;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      margin-top: 8px;
    }
    .arrow-down {
      text-align: center;
      font-size: 1.5rem;
      color: #00D4FF;
      opacity: 0.5;
      margin: 10px 0;
    }
    .legend {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 50px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .legend-color {
      width: 30px;
      height: 30px;
      border-radius: 6px;
    }
    .legend-color.primary { background: #00D4FF; }
    .legend-color.backup { background: #B388FF; }
    .legend-color.fallback { background: #FF6B9D; }
    .legend-text {
      font-size: 1rem;
      color: #E0E0E0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>三级工具链架构图</h1>
    <div class="toolchain">
      <div class="tool-row">
        <div class="tool-label">代码搜索</div>
        <div class="tool-levels">
          <div class="tool-level primary">
            <div class="tool-name">SearchCodebase</div>
            <div class="tool-desc">语义搜索，按意图找代码</div>
          </div>
          <div class="tool-level backup">
            <div class="tool-name">ast-grep</div>
            <div class="tool-desc">AST结构匹配</div>
            <div class="tool-stars">15.2K⭐</div>
          </div>
          <div class="tool-level fallback">
            <div class="tool-name">Grep+Glob</div>
            <div class="tool-desc">关键词搜索</div>
          </div>
        </div>
      </div>
      <div class="tool-row">
        <div class="tool-label">图表生成</div>
        <div class="tool-levels">
          <div class="tool-level primary">
            <div class="tool-name">Mermaid.js</div>
            <div class="tool-desc">流程图、概念图、时序图</div>
            <div class="tool-stars">89K⭐</div>
          </div>
          <div class="tool-level backup">
            <div class="tool-name">Chart.js</div>
            <div class="tool-desc">数据可视化图表</div>
            <div class="tool-stars">64K⭐</div>
          </div>
          <div class="tool-level fallback">
            <div class="tool-name">HTML/CSS</div>
            <div class="tool-desc">手动绘制</div>
          </div>
        </div>
      </div>
      <div class="tool-row">
        <div class="tool-label">文件写入</div>
        <div class="tool-levels">
          <div class="tool-level primary">
            <div class="tool-name">Write</div>
            <div class="tool-desc">直接写入文件</div>
          </div>
          <div class="tool-level backup">
            <div class="tool-name">SearchReplace</div>
            <div class="tool-desc">追加写入</div>
          </div>
          <div class="tool-level fallback">
            <div class="tool-name">echo</div>
            <div class="tool-desc">命令行输出</div>
          </div>
        </div>
      </div>
      <div class="tool-row">
        <div class="tool-label">渲染测试</div>
        <div class="tool-levels">
          <div class="tool-level primary">
            <div class="tool-name">RunCommand</div>
            <div class="tool-desc">浏览器打开测试</div>
          </div>
          <div class="tool-level backup">
            <div class="tool-name">Grep验证</div>
            <div class="tool-desc">结构验证</div>
          </div>
          <div class="tool-level fallback">
            <div class="tool-name">人工检查</div>
            <div class="tool-desc">手动打开检查</div>
          </div>
        </div>
      </div>
    </div>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color primary"></div>
        <div class="legend-text">主工具（首选）</div>
      </div>
      <div class="legend-item">
        <div class="legend-color backup"></div>
        <div class="legend-text">备用工具（开源高赞）</div>
      </div>
      <div class="legend-item">
        <div class="legend-color fallback"></div>
        <div class="legend-text">降级方案（兜底）</div>
      </div>
    </div>
  </div>
</body>
</html>
