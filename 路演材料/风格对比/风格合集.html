<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黑客松路演魔术师 - 5种风格合集对比</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: #111;
      color: #fff;
      overflow-x: hidden;
    }

    /* 顶部控制栏 */
    .control-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #333;
    }
    .control-bar .label {
      font-size: 0.9rem;
      color: #888;
      margin-right: 10px;
      white-space: nowrap;
    }
    .style-btn {
      padding: 8px 18px;
      border: 2px solid #555;
      background: transparent;
      color: #ccc;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .style-btn:hover { border-color: #fff; color: #fff; }
    .style-btn.active { border-color: #00D4FF; color: #00D4FF; background: rgba(0,212,255,0.1); }

    .view-toggle {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .view-btn {
      padding: 8px 16px;
      border: 2px solid #555;
      background: transparent;
      color: #ccc;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
    }
    .view-btn:hover { border-color: #fff; color: #fff; }
    .view-btn.active { border-color: #B388FF; color: #B388FF; background: rgba(179,136,255,0.1); }

    /* 单页预览模式 */
    .single-view { display: none; }
    .single-view.active { display: block; }
    .preview-frame {
      width: 100%;
      height: calc(100vh - 60px);
      margin-top: 60px;
      border: none;
    }

    /* 对比模式 */
    .compare-view { display: none; margin-top: 60px; padding: 20px; }
    .compare-view.active { display: block; }
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
    }
    .compare-card {
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #333;
      transition: all 0.3s;
      cursor: pointer;
    }
    .compare-card:hover {
      border-color: #00D4FF;
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0,212,255,0.2);
    }
    .compare-card .card-header {
      padding: 12px 16px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .compare-card .card-title {
      font-size: 1rem;
      font-weight: bold;
    }
    .compare-card .card-tag {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 10px;
      background: rgba(0,212,255,0.2);
      color: #00D4FF;
    }
    .compare-card iframe {
      width: 100%;
      height: 400px;
      border: none;
      pointer-events: none;
    }
    .compare-card .card-footer {
      padding: 10px 16px;
      background: #1a1a1a;
      font-size: 0.85rem;
      color: #888;
    }

    /* 风格配色预览条 */
    .color-bar {
      display: flex;
      height: 6px;
    }
    .color-bar span {
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="control-bar">
    <span class="label">风格切换：</span>
    <button class="style-btn active" onclick="switchStyle('v01')">v01 暗色科技风</button>
    <button class="style-btn" onclick="switchStyle('v02')">v02 工业风</button>
    <button class="style-btn" onclick="switchStyle('v03')">v03 商务风</button>
    <button class="style-btn" onclick="switchStyle('v04')">v04 卡通风</button>
    <button class="style-btn" onclick="switchStyle('v05')">v05 赛博朋克风</button>
    <div class="view-toggle">
      <button class="view-btn active" onclick="switchView('single')">单页预览</button>
      <button class="view-btn" onclick="switchView('compare')">五格对比</button>
    </div>
  </div>

  <!-- 单页预览 -->
  <div class="single-view active" id="singleView">
    <iframe class="preview-frame" id="previewFrame" src="v01_暗色科技风.html"></iframe>
  </div>

  <!-- 五格对比 -->
  <div class="compare-view" id="compareView">
    <div class="compare-grid">
      <div class="compare-card" onclick="switchStyle('v01'); switchView('single');">
        <div class="card-header">
          <span class="card-title">v01 暗色科技风</span>
          <span class="card-tag">默认</span>
        </div>
        <div class="color-bar">
          <span style="background:#1A1A2E"></span>
          <span style="background:#00D4FF"></span>
          <span style="background:#B388FF"></span>
        </div>
        <iframe src="v01_暗色科技风.html"></iframe>
        <div class="card-footer">深色背景 · 霓虹发光 · 科技感强 · 适合技术类/黑客松</div>
      </div>
      <div class="compare-card" onclick="switchStyle('v02'); switchView('single');">
        <div class="card-header">
          <span class="card-title">v02 工业风</span>
          <span class="card-tag">硬朗</span>
        </div>
        <div class="color-bar">
          <span style="background:#2C2C2C"></span>
          <span style="background:#FF6B35"></span>
          <span style="background:#7D7D7D"></span>
        </div>
        <iframe src="v02_工业风.html"></iframe>
        <div class="card-footer">等宽字体 · 模块化布局 · 金属质感 · 适合制造业/硬件</div>
      </div>
      <div class="compare-card" onclick="switchStyle('v03'); switchView('single');">
        <div class="card-header">
          <span class="card-title">v03 商务风</span>
          <span class="card-tag">专业</span>
        </div>
        <div class="color-bar">
          <span style="background:#FFFFFF"></span>
          <span style="background:#1E3A5F"></span>
          <span style="background:#4A90E2"></span>
        </div>
        <iframe src="v03_商务风.html"></iframe>
        <div class="card-footer">简约专业 · 衬线字体 · 大量留白 · 适合投资路演/企业汇报</div>
      </div>
      <div class="compare-card" onclick="switchStyle('v04'); switchView('single');">
        <div class="card-header">
          <span class="card-title">v04 卡通风</span>
          <span class="card-tag">活泼</span>
        </div>
        <div class="color-bar">
          <span style="background:#FFF8E7"></span>
          <span style="background:#FF6B6B"></span>
          <span style="background:#4ECDC4"></span>
        </div>
        <iframe src="v04_卡通风.html"></iframe>
        <div class="card-footer">圆润字体 · 彩色气泡 · 活泼可爱 · 适合教育/儿童/轻松场景</div>
      </div>
      <div class="compare-card" onclick="switchStyle('v05'); switchView('single');">
        <div class="card-header">
          <span class="card-title">v05 赛博朋克风</span>
          <span class="card-tag">未来</span>
        </div>
        <div class="color-bar">
          <span style="background:#0D0D0D"></span>
          <span style="background:#FF00FF"></span>
          <span style="background:#00FFFF"></span>
        </div>
        <iframe src="v05_赛博朋克风.html"></iframe>
        <div class="card-footer">高对比 · 霓虹渐变 · 故障动画 · 适合游戏/创意/年轻受众</div>
      </div>
    </div>
  </div>

  <script>
    const styleMap = {
      'v01': 'v01_暗色科技风.html',
      'v02': 'v02_工业风.html',
      'v03': 'v03_商务风.html',
      'v04': 'v04_卡通风.html',
      'v05': 'v05_赛博朋克风.html'
    };

    function switchStyle(id) {
      document.getElementById('previewFrame').src = styleMap[id];
      document.querySelectorAll('.style-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    function switchView(mode) {
      const singleView = document.getElementById('singleView');
      const compareView = document.getElementById('compareView');
      const viewBtns = document.querySelectorAll('.view-btn');

      viewBtns.forEach(btn => btn.classList.remove('active'));

      if (mode === 'single') {
        singleView.classList.add('active');
        compareView.classList.remove('active');
        viewBtns[0].classList.add('active');
      } else {
        singleView.classList.remove('active');
        compareView.classList.add('active');
        viewBtns[1].classList.add('active');
      }
    }
  </script>
</body>
</html>
